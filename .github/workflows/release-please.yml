name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - uses: pnpm/action-setup@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}

      - run: pnpm run lint
        if: ${{ steps.release.outputs.release_created }}

      - run: pnpm run format:check
        if: ${{ steps.release.outputs.release_created }}

      - run: pnpm run typecheck
        if: ${{ steps.release.outputs.release_created }}

      - run: pnpm test
        if: ${{ steps.release.outputs.release_created }}

      - run: pnpm run build
        if: ${{ steps.release.outputs.release_created }}

      # OIDC trusted publishing (tokenless auth) requires npm >= 11.5.1;
      # Node 24's bundled npm can predate that, so upgrade explicitly.
      - run: npm install -g npm@latest
        if: ${{ steps.release.outputs.release_created }}

      # setup-node's registry-url writes `_authToken=${NODE_AUTH_TOKEN}` into
      # the npmrc, and npm uses that placeholder token instead of OIDC trusted
      # publishing (-> 404). Strip only the auth line, keeping the registry
      # line so npm has a publish target and falls through to OIDC.
      - name: Enable OIDC trusted publishing (drop placeholder auth token)
        if: ${{ steps.release.outputs.release_created }}
        run: |
          sed -i '/:_authToken=/d' "$NPM_CONFIG_USERCONFIG"
          echo "--- npmrc after strip ---"; cat "$NPM_CONFIG_USERCONFIG"

      - run: npm publish --access public --provenance --loglevel verbose
        if: ${{ steps.release.outputs.release_created }}

      - name: Dump npm debug log on failure
        if: ${{ failure() && steps.release.outputs.release_created }}
        run: cat /home/runner/.npm/_logs/*-debug-0.log 2>/dev/null || true
