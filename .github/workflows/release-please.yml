name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - uses: pnpm/action-setup@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}

      - run: pnpm run lint
        if: ${{ steps.release.outputs.release_created }}

      - run: pnpm run format:check
        if: ${{ steps.release.outputs.release_created }}

      - run: pnpm run typecheck
        if: ${{ steps.release.outputs.release_created }}

      - run: pnpm test
        if: ${{ steps.release.outputs.release_created }}

      - run: pnpm run build
        if: ${{ steps.release.outputs.release_created }}

      # OIDC trusted publishing (tokenless auth) requires npm >= 11.5.1;
      # Node 24's bundled npm can predate that, so upgrade explicitly.
      - run: npm install -g npm@latest
        if: ${{ steps.release.outputs.release_created }}

      - name: Diagnose publish environment
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "npm version: $(npm --version)  path: $(command -v npm)"
          echo "node version: $(node --version)"
          echo "OIDC request url present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "registry: $(npm config get registry)"
          echo "--- ~/.npmrc ---"; cat ~/.npmrc 2>/dev/null || echo "(none)"
          echo "--- ./.npmrc ---"; cat ./.npmrc 2>/dev/null || echo "(none)"
          echo "NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG"
          [ -n "$NPM_CONFIG_USERCONFIG" ] && { echo "--- userconfig npmrc ---"; cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "(none)"; }

      - run: npm publish --access public --provenance
        if: ${{ steps.release.outputs.release_created }}
